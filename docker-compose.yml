version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fixpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fixpilot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: fixpilot-api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/fixpilot?schema=public
      REDIS_URL: redis://redis:6379
      ANTIGRAVITY_API_KEY: ${ANTIGRAVITY_API_KEY:-test-key}
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: fixpilot-dashboard
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: fixpilot-worker
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/fixpilot?schema=public
      REDIS_URL: redis://redis:6379
      ANTIGRAVITY_API_KEY: ${ANTIGRAVITY_API_KEY:-test-key}

volumes:
  postgres_data:
  redis_data:

